name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    env:
      # Placeholders. Nothing in the verification loop reaches Supabase or the API;
      # these exist because the web app refuses to build with the values missing.
      NEXT_PUBLIC_SUPABASE_URL: https://project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24: the JavaScript course runtime prints the way this Node prints, and its
          # content tests run every lesson sample under it (lib/javascript-runtime.ts).
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run scenario:check
      - run: npm run lint
      - run: npm run test
      # scripts/ is plain Node, not an npm workspace, so it runs under node:test directly
      # rather than through a package script. An explicit glob rather than the bare
      # `scripts/` directory: node --test's directory-argument scanning does not reliably
      # find files that way on every platform (confirmed broken for a bare directory on
      # Node 24 / Windows locally; the glob form worked everywhere tried).
      - run: node --test scripts/*.test.mjs
      - run: npm run build
      # What a crawler actually receives from the build: robots, sitemap, canonicals, noindex
      # and redirects. None of it reaches Supabase, because a crawler sends no session.
      - name: SEO checks against the production build
        run: |
          npm run start --workspace @untiered/web -- -p 3100 &
          node apps/web/scripts/check-seo.mjs http://localhost:3100

  api:
    name: api (ktlint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: ktlintCheck test build
        working-directory: apps/api
        run: ./gradlew ktlintCheck test build --no-daemon

  database:
    name: database (migrations, repository SQL, storage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start local Supabase and apply every migration
        run: |
          npm run db:start
          npm run db:reset -- --yes
          service_key="$(node scripts/supabase.mjs status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "TEST_SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run database integration tests
        working-directory: apps/api
        env:
          TEST_DB_URL: jdbc:postgresql://127.0.0.1:54322/postgres
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_SUPABASE_URL: http://127.0.0.1:54321
        run: ./gradlew test --tests '*DatabaseIntegrationTest' --no-daemon

  # The deployment images, built (never pushed) so a broken Dockerfile fails here rather
  # than on the day of a deploy. Placeholder public values, as in the web job.
  images:
    name: images (docker build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate VM deployment configuration
        env:
          API_DOMAIN: api.untiered.tech
          RELEASE_TAG: ci-placeholder
        run: |
          cp deploy/api.env.example deploy/api.env
          docker compose -f deploy/compose.yaml config -q
          docker run --rm -e API_DOMAIN \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: API image
        run: docker build -t untiered-api apps/api

      - name: Web image
        run: >
          docker build -f apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://project.supabase.co
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
          -t untiered-web .

      - name: Web image serves the landing page
        run: |
          docker run -d --name web -p 3000:3000 untiered-web
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/privacy 2>/dev/null || curl -fsS -o /dev/null http://localhost:3000/login; then echo "web is up"; exit 0; fi
            sleep 2
          done
          docker logs web
          exit 1

  # The website, deployed to Netlify from here because Netlify's free plan will not build a
  # private repository owned by a GitHub organisation. Only a push to the branch named in the
  # NETLIFY_PRODUCTION_BRANCH repository variable deploys, and only after every job above is
  # green; with the variable unset, nothing deploys. The build runs here with the site's
  # Netlify settings and Production environment variables, which the CLI fetches with the token.
  deploy-web:
    name: deploy web (Netlify)
    needs: [web, api, database, images]
    if: github.event_name == 'push' && vars.NETLIFY_PRODUCTION_BRANCH != '' && github.ref_name == vars.NETLIFY_PRODUCTION_BRANCH
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and deploy to production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_MESSAGE: ${{ github.ref_name }} ${{ github.sha }}
        run: npx --yes netlify-cli@27.16.1 deploy --prod --filter @untiered/web --message "$DEPLOY_MESSAGE"
