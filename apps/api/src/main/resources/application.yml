spring:
  application:
    name: untiered-api
  datasource:
    # The schema is owned by the Supabase CLI (supabase/migrations), not by this app.
    # The API reads and writes rows; it never runs DDL.
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 110s

server:
  port: ${API_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

# Spring Boot's built-in Logstash JSON formatter keeps stdout machine-searchable
# without adding another logging library. Set this to an empty value only for local
# troubleshooting that explicitly needs the old plain-text console format.
logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}

# Error reporting (Sentry). Off until SENTRY_DSN is set. Errors logged at ERROR — including
# every unhandled exception, which ApiExceptionHandler logs — become Sentry events; INFO and
# above ride along as breadcrumbs. No request bodies and no default PII are ever sent: bodies
# here are resumes and recordings of somebody's voice. The user is identified by account id
# only (SentryUserConfig), never by email or name.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  max-request-body-size: none
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  in-app-includes:
    - com.interviewos
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

interviewos:
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${EMAIL_FROM:}
    public-base-url: ${EMAIL_PUBLIC_BASE_URL:http://localhost:3000}
    api-base-url: ${EMAIL_API_BASE_URL:http://localhost:8080}
    daily-question-url: ${EMAIL_DAILY_QUESTION_URL:}
    content-token: ${EMAIL_CONTENT_TOKEN:}
  features:
    # Product-level kill switches. The same public environment variables are compiled
    # into the Next.js app, so one deployment setting hides the UI and closes its API.
    mock-interviews: ${NEXT_PUBLIC_FEATURE_MOCK_INTERVIEWS:true}
    courses: ${NEXT_PUBLIC_FEATURE_COURSES:true}
    arena: ${NEXT_PUBLIC_FEATURE_ARENA:true}
    reports: ${NEXT_PUBLIC_FEATURE_REPORTS:true}
    questions: ${NEXT_PUBLIC_FEATURE_QUESTIONS:${NEXT_PUBLIC_QUESTION_BANK_BROWSABLE:false}}
  auth:
    # Backend verifies Supabase-issued JWTs against the project's published JWKS.
    # No shared secret, and no user id is ever taken from the request body.
    supabase-url: ${SUPABASE_URL}
    audience: authenticated
  web:
    # Browser origins allowed to call the versioned public API. Mobile clients are
    # not browsers and are unaffected by CORS.
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:3000}
  gemini:
    # Gemini is the only provider that can hear a spoken answer or read a PDF, so it
    # remains the backbone. What changed is that it is no longer the only thing tried.
    api-key: ${GEMINI_API_KEY:}

  ai:
    budget:
      # Set below the Google Cloud spend cap. Zero is disabled until the owner chooses a limit.
      daily-cap-micro-usd: ${AI_DAILY_SPEND_CAP_MICRO_USD:0}
      per-user-daily-cap-micro-usd: ${AI_PER_USER_DAILY_CAP_MICRO_USD:2000000}
    # The models to try, in order. Each is offered only the calls it can actually serve
    # (see FallbackInterviewAi) -- a text-only model is never handed a recording of
    # somebody's voice.
    #
    # Measured pricing per million tokens, September 2026:
    #   gemini-2.5-flash-lite   $0.10 in / $0.40 out   multimodal
    #   gemini-3.5-flash        $1.50 in / $9.00 out   multimodal
    #   kimi-k2                 $0.55 in / $2.20 out   text only
    #   deepseek-v4-flash       $0.14 in / $0.28 out   text only
    #
    # gemini-3.1-flash-lite leads: of every live text-and-audio Gemini model checked
    # against the API on 2026-09-10 ($0.25 text in / $0.50 audio in / $1.50 out), it is
    # the cheapest one that can still hear a spoken answer and return structured JSON —
    # cheaper than gemini-3.5-flash-lite, which led before it ($0.30/$0.30/$2.50).
    # 3.5-flash sits behind it for when the cheap model is not good enough or is down.
    #
    # **Check this model still exists before assuming the chain is cheap.** It led with
    # `gemini-2.5-flash-lite` until Google retired that model — and `gemini-2.5-flash`
    # with it — some time before 2026-09-10. Nothing broke loudly: every call 404'd on the
    # primary and was quietly served by the model behind it at five times the price. The
    # ledger is what makes that visible now; `fell_back_from` on every row means the model
    # named here is gone. Verify against https://ai.google.dev/gemini-api/docs/models and
    # a live call, not against this comment — models get retired without warning.
    #
    # ORDER MATTERS AND IS RELIED ON: cheapest first, strongest last. Resume parsing
    # inverts it deliberately (FallbackInterviewAi.TRY_STRONGEST_FIRST) because it runs
    # once per candidate, nobody is waiting on it, and a misread employer degrades every
    # round they ever sit.
    providers:
      - name: gemini-lite
        kind: gemini
        model: ${GEMINI_PRIMARY_MODEL:gemini-3.1-flash-lite}
        # The longest the candidate waits on this model mid-round (the assessment, a hint,
        # the opening question, the voice) before the model behind it is asked instead.
        # Without it a stuck call held the room for the shared three-minute timeout. An
        # assessment normally returns in 3.5-7s and a question's voice in under 10s, so 20s
        # cuts off only a tail. Only the first model gets one: the last one able to hear an
        # answer has nobody behind it, and a deadline there ends the round. See InRoomDeadline.
        in-room-timeout: ${GEMINI_PRIMARY_IN_ROOM_TIMEOUT:20s}
      - name: gemini-flash
        kind: gemini
        model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash}
      # A third vendor, so a Google outage does not stop reports and hints as well as
      # interviews. Text only: it can never take an answer assessment. Unset, it is
      # skipped with a line in the log.
      - name: ${FALLBACK_PROVIDER_NAME:kimi}
        kind: openai
        base-url: ${FALLBACK_PROVIDER_BASE_URL:https://api.moonshot.ai/v1}
        model: ${FALLBACK_PROVIDER_MODEL:kimi-k2-0711-preview}
        api-key: ${FALLBACK_PROVIDER_API_KEY:}
  # Server-side code execution, for languages a browser cannot run. Off by default.
  #
  # Python runs in the candidate's own browser (Pyodide) and needs nothing here. Java
  # cannot, so it needs a Piston instance — and there is no free hosted one: the public
  # API went whitelist-only in February 2026 and answers 401.
  #
  # To turn Java on:  docker run -d -p 2000:2000 ghcr.io/engineer-man/piston
  #                   CODE_RUNNER_ENABLED=true CODE_RUNNER_BASE_URL=http://localhost:2000/api/v2
  #
  # With a runner configured, the candidate's source and its input leave our servers when
  # they press Run. Nothing else goes with it, and the room says so.
  code-runner:
    enabled: ${CODE_RUNNER_ENABLED:false}
    base-url: ${CODE_RUNNER_BASE_URL:https://emkc.org/api/v2/piston}
    run-timeout-millis: 5000
    compile-timeout-millis: 10000
  # How many completed rounds a candidate gets before being asked to pay.
  #
  # Deliberately absent, which means unlimited. There is no paid tier to gate against
  # yet, and a limit on an unproven product turns away the people whose use of it is
  # currently worth more than the model calls it saves.
  #
  # To bring the gate back, uncomment both lines. Nothing else changes -- the arithmetic
  # in Entitlement and the tests over it already cover both sides.
  #
  # entitlement:
  #   free-rounds: 1
  retention:
    # How long a round's report, transcript and recordings are kept before being cleared.
    #
    # Four weeks is the longest window over which the report is still doing its job: a
    # candidate reads it, works on what it said, and sits another round, and an interview
    # process itself runs its screen, loop and decision inside about a month. Past that it
    # is a recording of a rehearsal for an interview that already happened.
    #
    # The session row survives the sweep; the evidence behind it does not. Progress in this
    # product is derived from completed sessions, so deleting the row would tell a
    # candidate four weeks later that they had never sat the round.
    #
    # This number is also the sentence the dashboard shows them -- it rides out on every
    # SessionSummary rather than being written into the browser, so changing it here
    # changes what they are told.
    #
    # Written out rather than read from an env placeholder: it is a product decision, not
    # a per-deployment one, and it belongs where somebody reading the policy will find it.
    # A deployment that does need to differ can still set
    # INTERVIEWOS_RETENTION_REPORTSKEPTFOR, which outranks this file.
    reports-kept-for: 28d

  loop-brief:
    public-research:
      # Whether the loop brief for an employer we hold no sourced account of runs a
      # search-grounded lookup of public pages (task 065). Each search is billed per query,
      # so answers are reused for `kept-for`; the links Gemini cites are redirects that
      # expire, which is why that is hours rather than weeks. Off, those briefs show the
      # archetype pattern alone.
      enabled: ${INTERVIEWOS_PUBLIC_LOOP_RESEARCH:true}
      kept-for: 12h
      max-entries: 500
    model-knowledge:
      # When neither our record nor the search has anything, whether the brief asks the
      # model what it can name about the employer's process (the pool's knowledge check),
      # shown labelled as the model's knowledge. Off, those briefs show the archetype
      # pattern alone.
      enabled: ${INTERVIEWOS_MODEL_LOOP_KNOWLEDGE:true}
      kept-for: 7d
      max-entries: 500

  question-bank:
    # Whether candidates can browse the sourced bank at /questions (task 042). Off, the two
    # list endpoints answer 404 and the web app hides the pages, the nav entry and the loop
    # brief's link; rounds keep asking from the bank either way. The same env var the web
    # app reads, so one switch moves both.
    browsable: ${NEXT_PUBLIC_FEATURE_QUESTIONS:${NEXT_PUBLIC_QUESTION_BANK_BROWSABLE:false}}

  pool:
    # The hidden question pool: questions a model writes from its own knowledge, held
    # apart from the sourced bank and read by a round when the bank has nothing for that
    # company and round (PRD 03, 04, 08).
    #
    # `enabled: false` means a run can be planned and read but will not call a model. That
    # is the default and it is deliberate: this is the only thing in the product that
    # spends money with nobody waiting on the other end, so it starts when the owner says
    # so, in a session, and not before (CLAUDE.md rule 7). Task 043 is the run itself.
    enabled: ${POOL_GENERATION_ENABLED:false}
    # Conservative on purpose. Being rate-limited by Gemini is not a delay, it is a price
    # rise: a 429 on the lead model falls through to the model behind it at five to fifteen
    # times the cost, and a job nobody is watching would do its whole run that way.
    requests-per-minute: 20
    concurrency: 2
    questions-per-cell: 6
    # Cosine similarity at or above which two questions are the same question. These are
    # short texts in a narrow domain, where rephrasings sit high, so this is lower than a
    # general-purpose threshold would be. Needs a live embedding run to tune (task 043).
    duplicate-similarity: 0.90
    # $2.00, in millionths of a dollar, when a request does not name its own cap. A run
    # stops here and asks to be resumed rather than finishing whatever it was given.
    default-spend-cap-micro-usd: 2000000
    # What the cap check assumes the next call might cost, since its real cost is only
    # knowable afterwards. Generous on purpose: a cap that stops slightly early is a cap,
    # and one that stops slightly late is a report.
    call-headroom-micro-usd: 20000
    # 768 is a published Matryoshka truncation of gemini-embedding-001's native 3072. It
    # MUST equal the width of pool_questions.embedding, and it sits under pgvector's
    # 2000-dimension index ceiling, which 3072 does not.
    embedding-model: gemini-embedding-001
    embedding-dimensions: 768
    max-attempts-per-cell: 2

  admin:
    # Who may curate the source library. The library decides what the interviewer treats
    # as fact about a named employer, so this is closer to write access to the product
    # than to a user setting -- hence an explicit allow-list rather than a role column.
    #
    # An empty list denies everyone, which is the right default: a misconfigured
    # deployment should lock the operator out, not let the internet in.
    emails: ${ADMIN_EMAILS:}
    # Optional: Supabase user ids, comma-separated. When set, an admin must match both the
    # email and the id. When empty, the email must belong to a Google sign-in, because
    # Google has verified it (see AdminProperties.allows).
    user-ids: ${ADMIN_USER_IDS:}

  storage:
    # Service role bypasses RLS. Ownership is enforced by the API from the verified
    # token subject and by keying every object under `{userId}/`.
    supabase-url: ${SUPABASE_URL}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

spring.servlet.multipart:
  # Interview answers arrive as audio and video blobs; resumes as PDF or DOCX.
  max-file-size: 40MB
  max-request-size: 60MB
